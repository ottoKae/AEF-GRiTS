name: cross-platform downloader

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[download,web,dev]"
      - name: Run unit and synthetic integration tests
        run: python -m pytest
      - name: Verify installed commands
        run: |
          aef-grits-doctor --help
          aef-grits-points --help
          aef-grits-grid --help
          aef-grits-storage-check --help
          aef-grits-benchmark-summary --help
          aef-grits-auth --help
          aef-grits-auth status --json
      - name: Run a low-memory MGRS plan without Earth Engine access
        shell: bash
        run: |
          aef-grits-grid \
            --grid-scheme mgrs \
            --tiles 50RMU \
            --years 2025 \
            --out-dir "${RUNNER_TEMP}/aef-plan" \
            --state-dir "${RUNNER_TEMP}/aef-state" \
            --resource-profile low-memory-1g \
            --plan-only

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Web acceptance dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[download,web,web-e2e,dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run the six browser workflows
        run: python -m pytest tests/test_webapp_e2e.py
