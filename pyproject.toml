[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aef-grits"
version = "0.1.0"
description = "Reproducible AlphaEarth Foundation point and raster extraction workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
]

[project.optional-dependencies]
gee = [
  "earthengine-api>=1.0",
  "google-auth>=2.0",
  "requests>=2.31",
]
geo = [
  "affine>=2.4",
  "geopandas>=0.14",
  "matplotlib>=3.7",
  "mgrs>=1.5",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "scikit-learn>=1.3",
  "shapely>=2.0",
]
stream = [
  "dask[array]>=2024.1",
  "xarray>=2024.1",
  "zarr>=3.1",
]
download = [
  "earthengine-api>=1.4,<2",
  "google-auth>=2,<3",
  "requests>=2.31,<3",
  "affine>=2.4,<3",
  "dask[array]>=2024.1",
  "geopandas>=0.14,<2",
  "mgrs>=1.5,<2",
  "psutil>=5.9,<8",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "shapely>=2,<3",
  "xarray>=2024.1",
  "zarr>=3.1,<4",
]
web = ["flask>=3.1", "psutil>=5.9"]
web-e2e = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
aef-grits-doctor = "aef_grits.doctor:main"
aef-grits-points = "scripts.stream_aef_points_ee:main"
aef-grits-grid = "scripts.stream_aef_grid_ee:main"
aef-grits-storage-check = "scripts.check_aef_storage:main"

[tool.setuptools.packages.find]
include = ["aef_grits*", "scripts"]

[tool.setuptools.package-data]
"aef_grits" = ["data/*.parquet", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
