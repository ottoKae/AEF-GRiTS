[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aef-grits"
version = "0.1.0"
description = "Reproducible AlphaEarth Foundation point and raster extraction workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
]

[project.optional-dependencies]
gee = [
  "earthengine-api>=1.0",
  "google-auth>=2.0",
  "requests>=2.31",
]
geo = [
  "affine>=2.4",
  "geopandas>=0.14",
  "matplotlib>=3.7",
  "mgrs>=1.5",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "scikit-learn>=1.3",
  "shapely>=2.0",
]
stream = [
  "dask[array]>=2024.1",
  "xarray>=2024.1",
  "zarr>=3.1",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aef_grits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
